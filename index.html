
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Smart Budget Tracker</h1>
        <p>Manage Your Money Smartly!</p>
    </header>

    <main>

        <section class="summary">

            <div class="card">
                <h3>Amount</h3>
                <p id="totalBudget">₹0</p>
            </div>

            <div class="card">
                <h3>Transferred Amount</h3>
                <p id="expenses">₹0</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">₹0</p>
            </div>

        </section>

        <section class="budget">
            <h2>Set Monthly Budget</h2>
            <input type="number" id="budget" placeholder="Enter amount">
            <button onclick="setBudget()">Set Budget</button>
            <p id="budgetMessage">No budget set yet</p>
        </section>

        <section class="transaction">
            <h2>Add Transaction</h2>

            <input type="text" id="description" placeholder="Description">

            <input type="number" id="amount" placeholder="Enter amount">

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <button onclick="addTransaction()">Add Transaction</button>
        </section>

        <section class="history">
            <h2>Transaction History</h2>
            <ul id="history"></ul>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
